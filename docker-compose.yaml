services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NUXT_PUBLIC_BFF_BASE_URL: http://localhost:3001
    depends_on:
      bff:
        condition: service_started
  bff:
    build: ./bff
    ports: ["3001:3001"]
    environment:
      BACKEND_API_URL: http://backend:8080
      PORT: "3001"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: sales
      DATABASE_USER: sales
      DATABASE_PASSWORD: sales
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EXTERNAL_API_URL: http://wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiremock:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports: ["8089:8080"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
volumes:
  postgres-data:
