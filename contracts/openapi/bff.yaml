openapi: 3.0.3
info:
  title: Sales Portal BFF
  version: 0.1.0
paths:
  /api/customers:
    get:
      parameters:
        - in: query
          name: keyword
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Customer search result
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
  /api/customers/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
components:
  schemas:
    Customer:
      type: object
      required: [id, name, tier]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string, enum: [STANDARD, GOLD] }
    CustomerDetail:
      type: object
      required: [id, displayName, recentOrderCount]
      properties:
        id: { type: string }
        displayName: { type: string, nullable: false }
        recentOrderCount: { type: integer, minimum: 0 }
