apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: sales-backend }
  template:
    metadata:
      labels: { app: sales-backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/tonbiattack/enterprise-debug-lab-backend:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: sales-backend-config } }]
          env:
            - name: DATABASE_USER
              value: sales
            - name: DATABASE_PASSWORD
              value: sales
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sales-backend
spec:
  selector: { app: sales-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
